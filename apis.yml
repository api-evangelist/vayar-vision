description: Vayar Vision Ltd was an Israeli startup (company no. 514054972, incorporated 2007-11-26,
  Herzliya) that developed a visual search engine enabling search for images based on their visual
  characteristics rather than textual tagging - positioned as "a Google for pictures" turning images
  into searchable knowledge. A Battery Ventures portfolio company listed as an exited investment, the
  company has been wilfully dissolved (last annual report 2021) and its former website vayar.com no
  longer resolves. No API surface, developer program, or published artifacts exist.
